services:
  db:
    image: postgres:15
    restart: unless-stopped
    expose:
      - 5432
    volumes:
      - dev-db:/var/lib/postgresql/data:z
    environment:
      POSTGRES_DB: inventree
      POSTGRES_USER: inventree_user
      POSTGRES_PASSWORD: inventree_password

  redis:
    image: redis:7.0
    restart: always
    ports:
      - 6379

  toolkit:
    # Keep the container alive for docker exec. VS Code overrideCommand: true
    # ignores this, so it only applies to plain Docker Compose usage.
    command: sleep infinity
    ports:
      # Expose the InvenTree dev server on the same port inside and outside
      # the container so http://localhost:8001 works from both host and tests.
      - 8001:8001
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/workspace:z
      - inventree-data:/inventree-data
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      INVENTREE_DB_ENGINE: postgresql
      INVENTREE_DB_NAME: inventree
      INVENTREE_DB_HOST: db
      INVENTREE_DB_USER: inventree_user
      INVENTREE_DB_PASSWORD: inventree_password
      INVENTREE_DEBUG: True
      INVENTREE_CACHE_HOST: redis
      INVENTREE_CACHE_PORT: 6379
      INVENTREE_PLUGINS_ENABLED: True
      INVENTREE_SITE_URL: http://localhost:8001
      INVENTREE_CORS_ORIGIN_ALLOW_ALL: True
      INVENTREE_DATA_DIR: /inventree-data
      INVENTREE_PY_ENV: /inventree-data/venv
      INVENTREE_DEVCONTAINER: True

    depends_on:
      - db

volumes:
  dev-db:
  inventree-data:
